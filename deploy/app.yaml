apiVersion: apps/v1
kind: Deployment
metadata:
  name: top-one-percent-club
  namespace: top-one-percent-club
spec:
  replicas: 1
  selector:
    matchLabels: { app: top-one-percent-club }
  template:
    metadata:
      labels: { app: top-one-percent-club }
    spec:
      containers:
        - name: app
          image: ghcr.io/danieliyahu1/top-one-percent-club:sha-d56e5917e1d508d74852a7115e80f0eb4b8dd50d
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet: { path: /healthz, port: 3001 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 3001 }
            initialDelaySeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: top-one-percent-club
  namespace: top-one-percent-club
spec:
  selector: { app: top-one-percent-club }
  ports:
    - port: 80
      targetPort: 3001
