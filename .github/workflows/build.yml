name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check

  build:
    needs: validate
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container health endpoint
        run: |
          docker run --detach --rm --name top-one-percent-club -p 3001:3001 "${REGISTRY}/${IMAGE}:sha-${GITHUB_SHA}"
          trap 'docker stop top-one-percent-club' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3001/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs top-one-percent-club
          exit 1

      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push verified image
        if: github.event_name == 'push'
        run: docker image push --all-tags "${REGISTRY}/${IMAGE}"

      - name: Bump image tag in deploy manifest
        if: github.event_name == 'push'
        run: |
          SHA_TAG="sha-${GITHUB_SHA}"
          sed -i "s|image: ghcr.io/${GITHUB_REPOSITORY}:.*|image: ghcr.io/${GITHUB_REPOSITORY}:${SHA_TAG}|" deploy/app.yaml
          if git diff --quiet deploy/app.yaml; then
            echo "manifest already points at ${SHA_TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/app.yaml
          git commit -m "deploy: ${SHA_TAG} [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
